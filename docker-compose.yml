version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "8081:80"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service

  user-service:
    build: ./services/user-service
    ports:
      - "8001:8001"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  product-service:
    build: ./services/product-service
    ports:
      - "8002:8002"

  order-service:
    build: ./services/order-service
    ports:
      - "8003:8003"
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}

  payment-service:
    build: ./services/payment-service
    ports:
      - "8004:8004"

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    environment:
      - SMTP_PASS=${SMTP_PASS}

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8006:8006"
